# Custom Semgrep rules for DevSecOps project
# These rules detect common security issues in Flask/Python applications

rules:
  - id: flask-debug-enabled
    pattern: app.run(..., debug=True, ...)
    message: Flask debug mode is enabled in production
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      owasp: 'A05:2021 - Security Misconfiguration'
      cwe: 'CWE-489: Active Debug Code'
      technology:
        - flask
    fix-regex:
      regex: 'debug=True'
      replacement: 'debug=False'

  - id: hardcoded-secret-key
    pattern: SECRET_KEY = "$WORD"
    message: Hardcoded Flask secret key detected
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      owasp: 'A02:2021 - Cryptographic Failures'
      cwe: 'CWE-798: Use of Hard-coded Credentials'
      technology:
        - flask

  - id: hardcoded-jwt-secret
    pattern: JWT_SECRET_KEY = "$WORD"
    message: Hardcoded JWT secret key detected
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      owasp: 'A02:2021 - Cryptographic Failures'
      cwe: 'CWE-798: Use of Hard-coded Credentials'
      technology:
        - flask
        - jwt

  - id: weak-password-hash
    pattern: generate_password_hash($PASSWORD, method='md5')
    message: Weak password hashing algorithm (MD5) detected
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      owasp: 'A02:2021 - Cryptographic Failures'
      cwe: 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
      technology:
        - werkzeug

  - id: sql-injection-string-format
    pattern: db.execute("..." + $VAR + "...")
    message: Potential SQL injection via string concatenation
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      owasp: 'A03:2021 - Injection'
      cwe: 'CWE-89: SQL Injection'
      technology:
        - sqlalchemy
        - sqlite

  - id: eval-user-input
    pattern: eval($USER_INPUT)
    message: eval() with user input is dangerous
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      owasp: 'A03:2021 - Injection'
      cwe: 'CWE-94: Code Injection'
      technology:
        - python

  - id: exec-user-input
    pattern: exec($USER_INPUT)
    message: exec() with user input is dangerous
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      owasp: 'A03:2021 - Injection'
      cwe: 'CWE-94: Code Injection'
      technology:
        - python

  - id: insecure-deserialization
    pattern: pickle.loads($USER_INPUT)
    message: Insecure deserialization with pickle
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      owasp: 'A08:2021 - Software and Data Integrity Failures'
      cwe: 'CWE-502: Deserialization of Untrusted Data'
      technology:
        - python

  - id: hardcoded-api-key
    pattern: API_KEY = "$WORD"
    message: Hardcoded API key detected
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      owasp: 'A07:2021 - Identification and Authentication Failures'
      cwe: 'CWE-798: Use of Hard-coded Credentials'
      technology:
        - python

  - id: weak-token-expiry
    patterns:
      - pattern: JWT_ACCESS_TOKEN_EXPIRES = $NUM
      - metavariable-comparison:
          metavariable: $NUM
          comparison: $NUM < 900
    message: JWT token expiry time is too short (should be at least 900 seconds)
    severity: WARNING
    languages: [python]
    metadata:
      category: security
      owasp: 'A07:2021 - Identification and Authentication Failures'
      cwe: 'CWE-613: Insufficient Session Expiration'
      technology:
        - jwt
