# Gitleaks configuration for secrets detection
# Custom rules + allowlist for known false positives (never allowlist real secrets)

extend-default = true

[[rules]]
description = "GitHub Personal Access Token"
id = "github-pat"
regex = '''ghp_[a-zA-Z0-9]{36}'''
keywords = ["ghp_"]

[[rules]]
description = "AWS Access Key ID"
id = "aws-access-key"
regex = '''AKIA[0-9A-Z]{16}'''
keywords = ["AKIA"]

[[rules]]
description = "Slack Token"
id = "slack-token"
regex = '''xox[baprs]-[0-9]{12}-[0-9]{12}-[0-9]{12}-[a-z0-9]{32}'''
keywords = ["xoxb", "xoxp", "xoxa", "xoxr", "xoxs"]

[allowlist]
description = "Global allowlist for known false positives (placeholders only)"

# Demo secrets intentionally live on demo/* branches and must NOT be allowlisted,
# otherwise the leaked-secret demo would never fail.
paths = [
  '''tests/''',
  '''\.test\.py$''',
  '''\.example$''',
  '''\.example\.[a-z]+$''',
]

regexes = [
  '''placeholder''',
  '''your-''',
  '''replace-with''',
  '''localhost''',
  '''127\.0\.0\.1''',
  '''0\.0\.0\.0''',
]
