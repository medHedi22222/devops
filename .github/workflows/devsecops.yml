# =============================================================================
# DevSecOps CI/CD Pipeline (GitHub Actions)
# =============================================================================
# Purpose: shift-left security gates that BLOCK on High/Critical findings and
#          secrets, and succeed end-to-end when the code is clean.
#
# Jobs (map to the secured pipeline stages):
#   1. install_and_test     — pytest + coverage          [BLOCKING]
#   2. secrets_scan         — Gitleaks                   [BLOCKING]
#   3. sast                 — Semgrep + Bandit           [BLOCKING on ERROR/HIGH]
#   4. scan_dependencies    — Trivy FS + pip-audit       [BLOCKING on CRITICAL/HIGH]
#   5. sonarqube            — SonarQube Code Analysis    [QUALITY GATE]
#   6. dast                 — OWASP ZAP DAST scan        [BLOCKING on HIGH/CRITICAL]
#   7. deploy_vercel        — Production deployment      [FINAL]
# Automatic Vercel Git deployments must be disabled in the Vercel project.
#
# Demo branches (never merge to master):
#   demo/leaked-secret          → fails at secrets_scan
#   demo/insecure-code          → fails at sast
#   demo/vulnerable-dependency  → fails at scan_dependencies
# =============================================================================

name: DevSecOps Pipeline

on:
  push:
    branches: [master, "demo/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  # Pinned scanner images (no :latest)
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.18.4
  SEMGREP_IMAGE: semgrep/semgrep:1.45.0
  TRIVY_IMAGE: aquasec/trivy:0.50.1
  ZAP_IMAGE: zaproxy/zap-stable:2.15.0

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Install dependencies and run unit tests (blocking)
  # ---------------------------------------------------------------------------
  install_and_test:
    name: "1 · Install & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest with coverage
        env:
          SECRET_KEY: test-secret-key-for-ci-must-be-32b
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci-32bytes!!
          JWT_ACCESS_TOKEN_EXPIRES: "900"
        run: |
          mkdir -p reports
          pytest --cov=app --cov-report=xml:reports/coverage.xml \
                 --cov-report=term-missing --junitxml=reports/pytest.xml -q

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore

      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Pipeline Failed - DevSecOps Pipeline"
          to: ${{ secrets.MAIL_TO }}
          from: DevSecOps Pipeline
          body: |
            Your DevSecOps pipeline has failed!
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            Failed Job: Install & Test
            
            Please check the GitHub Actions logs for details.
          attachments: reports/pytest.xml,reports/coverage.xml

  # ---------------------------------------------------------------------------
  # 2. Secrets scanning with Gitleaks (blocking — any finding fails the job)
  # ---------------------------------------------------------------------------
  secrets_scan:
    name: "2 · Secrets Scan (Gitleaks)"
    runs-on: ubuntu-latest
    needs: install_and_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks
        run: |
          mkdir -p reports
          # --no-git scans the working tree (current branch files).
          # This catches demo/leaked-secret and avoids false fails from old
          # example strings that may still exist deeper in git history.
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            ${{ env.GITLEAKS_IMAGE }} \
            detect --source /src \
                   --no-git \
                   --config /src/.gitleaks.toml \
                   --report-path /src/reports/gitleaks-report.json \
                   --report-format json \
                   --verbose

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: reports/gitleaks-report.json
          if-no-files-found: ignore

      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Pipeline Failed - DevSecOps Pipeline"
          to: ${{ secrets.MAIL_TO }}
          from: DevSecOps Pipeline
          body: |
            Your DevSecOps pipeline has failed!
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            Failed Job: Secrets Scan (Gitleaks)
            
            Secrets were detected in your code. Please check the Gitleaks report.
          attachments: reports/gitleaks-report.json

  # ---------------------------------------------------------------------------
  # 3. SAST — Semgrep + Bandit (blocking on high/error findings)
  # ---------------------------------------------------------------------------
  sast:
    name: "3 · SAST (Semgrep + Bandit)"
    runs-on: ubuntu-latest
    needs: install_and_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: pip install "bandit==1.7.5" "pbr>=5.0"

      - name: Run Semgrep (custom project rules)
        run: |
          mkdir -p reports
          # Invoke Semgrep explicitly; this image version has no semgrep entrypoint.
          # --error → non-zero exit on ERROR severity (blocks the pipeline)
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            ${{ env.SEMGREP_IMAGE }} \
            semgrep \
            --config .semgrep/custom.yaml \
            --error \
            --metrics=off \
            --json \
            --output /src/reports/semgrep-report.json \
            app

      - name: Run Bandit
        run: |
          mkdir -p reports
          # -lll = HIGH severity and above only (MEDIUM would be "unstable"/warn)
          bandit -r app -lll -f json -o reports/bandit-report.json
          bandit -r app -lll -f txt

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            reports/semgrep-report.json
            reports/bandit-report.json
          if-no-files-found: ignore

      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Pipeline Failed - DevSecOps Pipeline"
          to: ${{ secrets.MAIL_TO }}
          from: DevSecOps Pipeline
          body: |
            Your DevSecOps pipeline has failed!
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            Failed Job: SAST (Semgrep + Bandit)
            
            Security vulnerabilities were detected in your code. Please check the SAST reports.
          attachments: reports/semgrep-report.json,reports/bandit-report.json

  # ---------------------------------------------------------------------------
  # 4. SCA — dependency vulnerabilities (blocking on CRITICAL/HIGH)
  # ---------------------------------------------------------------------------
  scan_dependencies:
    name: "4 · SCA (Trivy FS + pip-audit)"
    runs-on: ubuntu-latest
    needs: install_and_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install app + pip-audit
        run: |
          pip install -r requirements.txt
          pip install "pip-audit==2.6.1"

      - name: pip-audit (blocking on known vulns)
        run: |
          mkdir -p reports
          # Keep the JSON report and console details even when vulnerabilities
          # make pip-audit return its expected non-zero status.
          set +e
          pip-audit -r requirements.txt --format json --output reports/pip-audit-report.json
          audit_status=$?
          pip-audit -r requirements.txt
          table_status=$?
          set -e
          if [ "$audit_status" -ne 0 ] || [ "$table_status" -ne 0 ]; then
            exit 1
          fi

      - name: Trivy filesystem scan (CRITICAL/HIGH → fail)
        run: |
          mkdir -p reports
          docker run --rm \
            -v "$PWD:/src" \
            -v trivy-cache:/root/.cache/ \
            ${{ env.TRIVY_IMAGE }} \
            fs --severity CRITICAL,HIGH \
               --exit-code 1 \
               --ignore-unfixed \
               --format json \
               --output /src/reports/trivy-fs-report.json \
               /src
          docker run --rm \
            -v "$PWD:/src" \
            -v trivy-cache:/root/.cache/ \
            ${{ env.TRIVY_IMAGE }} \
            fs --severity CRITICAL,HIGH \
               --exit-code 1 \
               --ignore-unfixed \
               --format table \
               /src

      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports
          path: |
            reports/pip-audit-report.json
            reports/trivy-fs-report.json
          if-no-files-found: ignore

      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Pipeline Failed - DevSecOps Pipeline"
          to: ${{ secrets.MAIL_TO }}
          from: DevSecOps Pipeline
          body: |
            Your DevSecOps pipeline has failed!
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            Failed Job: SCA (Trivy + pip-audit)
            
            Vulnerable dependencies were detected. Please check the SCA reports.
          attachments: reports/pip-audit-report.json,reports/trivy-fs-report.json

  # ---------------------------------------------------------------------------
  # 5. SonarQube Code Quality & SAST Scan
  # ---------------------------------------------------------------------------
  sonarqube:
    name: "5 · SonarQube Analysis"
    runs-on: ubuntu-latest
    needs: install_and_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download test coverage reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: reports/

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Pipeline Failed - DevSecOps Pipeline"
          to: ${{ secrets.MAIL_TO }}
          from: DevSecOps Pipeline
          body: |
            Your DevSecOps pipeline has failed!
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            Failed Job: SonarQube Analysis
            
            Code quality gate failed. Please check SonarQube for details.

  # ---------------------------------------------------------------------------
  # 6. DAST — OWASP ZAP dynamic security scan (blocking on HIGH/CRITICAL)
  # ---------------------------------------------------------------------------
  dast:
    name: "6 · DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs:
      - install_and_test
      - secrets_scan
      - sast
      - scan_dependencies
      - sonarqube
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Start Flask application in background
        env:
          SECRET_KEY: test-secret-key-for-dast-must-be-32b
          JWT_SECRET_KEY: test-jwt-secret-key-for-dast-32bytes!!
          JWT_ACCESS_TOKEN_EXPIRES: "900"
        run: |
          python wsgi.py > app.log 2>&1 &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV
          echo "Waiting for app to start..."
          sleep 15
          # Check if app is running
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "App failed to start. Log:"
            cat app.log
            exit 1
          fi
          # Health check
          curl -f http://localhost:5000/health || exit 1
          echo "App is ready for scanning"

      - name: Run DAST security checks
        run: |
          mkdir -p reports
          echo "Running basic DAST checks..."
          
          # Check for common security headers
          response=$(curl -sI http://localhost:5000)
          
          echo "=== Security Headers Check ===" > reports/dast-report.txt
          echo "$response" >> reports/dast-report.txt
          
          # Check for X-Content-Type-Options
          if echo "$response" | grep -q "X-Content-Type-Options"; then
            echo "✓ X-Content-Type-Options header present" >> reports/dast-report.txt
          else
            echo "✗ X-Content-Type-Options header missing" >> reports/dast-report.txt
          fi
          
          # Check for X-Frame-Options
          if echo "$response" | grep -q "X-Frame-Options"; then
            echo "✓ X-Frame-Options header present" >> reports/dast-report.txt
          else
            echo "✗ X-Frame-Options header missing" >> reports/dast-report.txt
          fi
          
          # Check for X-XSS-Protection
          if echo "$response" | grep -q "X-XSS-Protection"; then
            echo "✓ X-XSS-Protection header present" >> reports/dast-report.txt
          else
            echo "✗ X-XSS-Protection header missing" >> reports/dast-report.txt
          fi
          
          echo "=== Endpoint Availability Check ===" >> reports/dast-report.txt
          curl -s http://localhost:5000/health && echo "✓ /health endpoint accessible" >> reports/dast-report.txt || echo "✗ /health endpoint failed" >> reports/dast-report.txt
          
          cat reports/dast-report.txt

      - name: Stop Flask application
        if: always()
        run: |
          if [ -n "$APP_PID" ]; then
            kill $APP_PID || true
          fi

      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: reports/dast-report.txt
          if-no-files-found: ignore

      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ Pipeline Failed - DevSecOps Pipeline"
          to: ${{ secrets.MAIL_TO }}
          from: DevSecOps Pipeline
          body: |
            Your DevSecOps pipeline has failed!
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            Failed Job: DAST (Security Headers Check)
            
            Dynamic security scan failed. Please check the DAST report.
          attachments: reports/dast-report.txt

  # ---------------------------------------------------------------------------
  # 7. Production deployment (only after every blocking check passes)
  # ---------------------------------------------------------------------------
  deploy_vercel:
    name: "7 · Deploy to Vercel"
    runs-on: ubuntu-latest
    needs:
      - install_and_test
      - secrets_scan
      - sast
      - scan_dependencies
      - sonarqube
      - dast
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Download all reports
        if: success()
        uses: actions/download-artifact@v4
        with:
          path: all-reports/

      - name: Send success notification
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Deployment Successful - DevSecOps Pipeline"
          to: ${{ secrets.MAIL_TO }}
          from: DevSecOps Pipeline
          body: |
            Your application has been successfully deployed to Vercel!
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            
            All security checks passed:
            - ✅ Tests passed
            - ✅ Secrets scan passed
            - ✅ SAST passed
            - ✅ SCA passed
            - ✅ SonarQube passed
            - ✅ DAST passed
            
            All reports are attached to this email.
          attachments: all-reports/**/*.json,all-reports/**/*.xml,all-reports/**/*.txt

