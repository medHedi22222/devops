# =============================================================================
# DevSecOps CI/CD Pipeline (GitHub Actions)
# =============================================================================
# Purpose: shift-left security gates that BLOCK on High/Critical findings and
#          secrets, and succeed end-to-end when the code is clean.
#
# Jobs (map to the secured pipeline stages):
#   1. install_and_test     — pytest + coverage          [BLOCKING]
#   2. secrets_scan         — Gitleaks                   [BLOCKING]
#   3. sast                 — Semgrep + Bandit           [BLOCKING on ERROR/HIGH]
#   4. scan_dependencies    — Trivy FS + pip-audit       [BLOCKING on CRITICAL/HIGH]
# Deployment is handled by Vercel's GitHub integration on pushes to master.
# Docker image jobs are intentionally not required.
#
# Demo branches (never merge to master):
#   demo/leaked-secret          → fails at secrets_scan
#   demo/insecure-code          → fails at sast
#   demo/vulnerable-dependency  → fails at scan_dependencies
# =============================================================================

name: DevSecOps Pipeline

on:
  push:
    branches: [master, "demo/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  # Pinned scanner images (no :latest)
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.18.4
  SEMGREP_IMAGE: semgrep/semgrep:1.45.0
  TRIVY_IMAGE: aquasec/trivy:0.50.1

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Install dependencies and run unit tests (blocking)
  # ---------------------------------------------------------------------------
  install_and_test:
    name: "1 · Install & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest with coverage
        env:
          SECRET_KEY: test-secret-key-for-ci-must-be-32b
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci-32bytes!!
          JWT_ACCESS_TOKEN_EXPIRES: "900"
        run: |
          mkdir -p reports
          pytest --cov=app --cov-report=xml:reports/coverage.xml \
                 --cov-report=term-missing --junitxml=reports/pytest.xml -q

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. Secrets scanning with Gitleaks (blocking — any finding fails the job)
  # ---------------------------------------------------------------------------
  secrets_scan:
    name: "2 · Secrets Scan (Gitleaks)"
    runs-on: ubuntu-latest
    needs: install_and_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks
        run: |
          mkdir -p reports
          # --no-git scans the working tree (current branch files).
          # This catches demo/leaked-secret and avoids false fails from old
          # example strings that may still exist deeper in git history.
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            ${{ env.GITLEAKS_IMAGE }} \
            detect --source /src \
                   --no-git \
                   --config /src/.gitleaks.toml \
                   --report-path /src/reports/gitleaks-report.json \
                   --report-format json \
                   --verbose

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: reports/gitleaks-report.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. SAST — Semgrep + Bandit (blocking on high/error findings)
  # ---------------------------------------------------------------------------
  sast:
    name: "3 · SAST (Semgrep + Bandit)"
    runs-on: ubuntu-latest
    needs: install_and_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: pip install "bandit==1.7.5" "pbr>=5.0"

      - name: Run Semgrep (custom project rules)
        run: |
          mkdir -p reports
          # Invoke Semgrep explicitly; this image version has no semgrep entrypoint.
          # --error → non-zero exit on ERROR severity (blocks the pipeline)
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            ${{ env.SEMGREP_IMAGE }} \
            semgrep \
            --config .semgrep/custom.yaml \
            --error \
            --metrics=off \
            --json \
            --output /src/reports/semgrep-report.json \
            app

      - name: Run Bandit
        run: |
          mkdir -p reports
          # -lll = HIGH severity and above only (MEDIUM would be "unstable"/warn)
          bandit -r app -lll -f json -o reports/bandit-report.json
          bandit -r app -lll -f txt

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            reports/semgrep-report.json
            reports/bandit-report.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 4. SCA — dependency vulnerabilities (blocking on CRITICAL/HIGH)
  # ---------------------------------------------------------------------------
  scan_dependencies:
    name: "4 · SCA (Trivy FS + pip-audit)"
    runs-on: ubuntu-latest
    needs: install_and_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install app + pip-audit
        run: |
          pip install -r requirements.txt
          pip install "pip-audit==2.6.1"

      - name: pip-audit (blocking on known vulns)
        run: |
          mkdir -p reports
          # Keep the JSON report and console details even when vulnerabilities
          # make pip-audit return its expected non-zero status.
          set +e
          pip-audit -r requirements.txt --format json --output reports/pip-audit-report.json
          audit_status=$?
          pip-audit -r requirements.txt
          table_status=$?
          set -e
          if [ "$audit_status" -ne 0 ] || [ "$table_status" -ne 0 ]; then
            exit 1
          fi

      - name: Trivy filesystem scan (CRITICAL/HIGH → fail)
        run: |
          mkdir -p reports
          docker run --rm \
            -v "$PWD:/src" \
            -v trivy-cache:/root/.cache/ \
            ${{ env.TRIVY_IMAGE }} \
            fs --severity CRITICAL,HIGH \
               --exit-code 1 \
               --ignore-unfixed \
               --format json \
               --output /src/reports/trivy-fs-report.json \
               /src
          docker run --rm \
            -v "$PWD:/src" \
            -v trivy-cache:/root/.cache/ \
            ${{ env.TRIVY_IMAGE }} \
            fs --severity CRITICAL,HIGH \
               --exit-code 1 \
               --ignore-unfixed \
               --format table \
               /src

      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports
          path: |
            reports/pip-audit-report.json
            reports/trivy-fs-report.json
          if-no-files-found: ignore
