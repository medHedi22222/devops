# Optional local SonarQube only (no Jenkins).
# Start with: docker compose -f infra/docker-compose.yml up -d
# Then point SonarLint / sonar-scanner at http://localhost:9000
#
# The CI/CD pipeline itself runs on GitHub Actions — not Jenkins.

services:
  sonarqube:
    image: sonarqube:10.4.1-community
    container_name: sonarqube
    depends_on:
      - sonarqube-db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - devsecops-network
    restart: unless-stopped

  sonarqube-db:
    image: postgres:15.6-alpine
    container_name: sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - devsecops-network
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:

networks:
  devsecops-network:
    driver: bridge
