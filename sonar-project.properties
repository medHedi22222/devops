# SonarQube project configuration
# This file configures SonarQube analysis for the project

# Project identification
sonar.projectKey=devsecops-flask
sonar.projectName=DevSecOps Flask Application
sonar.projectVersion=1.0

# Source code location
sonar.sources=app
sonar.tests=tests

# Python-specific configuration
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=pytest-report.xml

# Exclusions
sonar.exclusions=**/migrations/**,**/venv/**,**/.venv/**,**/node_modules/**
sonar.test.exclusions=**/tests/**

# Code coverage exclusions
sonar.coverage.exclusions=**/tests/**,**/migrations/**

# Duplication detection
sonar.cpd.python.minimumTokens=50

# Encoding
sonar.sourceEncoding=UTF-8

# Quality gate configuration (will be configured in SonarQube server)
# Target: no new bugs, no new vulnerabilities, coverage >= 80% on new code
